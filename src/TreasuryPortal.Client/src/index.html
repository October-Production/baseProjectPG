<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <title>Treasury Portal</title>
    <!-- Сервер подменяет href на PathBase приложения: один билд и для корня сайта,
         и для виртуального приложения IIS -->
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // Схема выставляется до первой отрисовки, иначе при тёмной теме экран моргает белым.
      // Значение пишет core/theme/theme.service.ts.
      (function () {
        try {
          var saved = localStorage.getItem('tp-theme');
          var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body class="mat-typography">
    <tp-root>
      <div class="tp-boot">
        <img src="assets/img/sense-logo.png" alt="Sense Bank" />
        <span>Завантаження Treasury Portal…</span>
      </div>
    </tp-root>
  </body>
</html>
